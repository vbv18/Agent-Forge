<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>AgentForge — Autonomous AI Agent Platform</title>
    <meta name="title" content="AgentForge — Autonomous AI Agent Platform" />
    <meta
      name="description"
      content="AgentForge is an intelligent platform to build, orchestrate, and collaborate with autonomous AI agents. Streamline complex workflows with advanced multi-agent architecture."
    />
    <meta
      name="keywords"
      content="AgentForge, AI agents, autonomous agents, multi-agent systems, agent orchestration, AI workflows, LLM agents"
    />
    <meta name="author" content="AgentForge" />
    <meta name="robots" content="index, follow" />
    <meta
      name="googlebot"
      content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://agentforge.ai/" />

    <!-- Theme & Color Scheme -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0d0f14" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="/" />
    <meta
      property="og:title"
      content="AgentForge — Autonomous AI Agent Platform"
    />
    <meta
      property="og:description"
      content="AgentForge is an intelligent platform to build, orchestrate, and collaborate with autonomous AI agents. Streamline complex workflows with advanced multi-agent architecture."
    />
    <meta property="og:site_name" content="AgentForge" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="AgentForge — Autonomous AI Agent Platform"
    />
    <meta
      name="twitter:description"
      content="AgentForge is an intelligent platform to build, orchestrate, and collaborate with autonomous AI agents. Streamline complex workflows with advanced multi-agent architecture."
    />

    <!-- Mobile & PWA Enhancements -->
    <meta name="application-name" content="AgentForge" />
    <meta name="apple-mobile-web-app-title" content="AgentForge" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- Favicon (User will provide custom icon later) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Structured Data (JSON-LD) for Search Engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "AgentForge",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "All",
        "description": "An intelligent platform to build, orchestrate, and collaborate with autonomous AI agents.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <noscript>You need to enable JavaScript to run AgentForge.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
